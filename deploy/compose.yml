name: modeer
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modeer
      POSTGRES_DB: modeer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modeer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTH_REQUIRED: "true"
      DATABASE_URL: postgresql+psycopg://modeer:${DB_PASSWORD}@db:5432/modeer
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on: [backend]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "certificates:/data", "caddy_config:/config"]
    depends_on: [frontend]
volumes:
  database:
  certificates:
  caddy_config:

