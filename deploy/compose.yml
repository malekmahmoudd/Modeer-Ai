name: modeer
services:
  db:
    # Pinned by digest; refresh with `docker pull postgres:16-alpine`.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: modeer
      POSTGRES_DB: modeer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modeer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTH_REQUIRED: "true"
      DATABASE_URL: postgresql+psycopg://modeer:${DB_PASSWORD}@db:5432/modeer
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on: [backend]
  proxy:
    # Pinned by digest; refresh with `docker pull caddy:2-alpine`.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "certificates:/data", "caddy_config:/config"]
    depends_on: [frontend]
volumes:
  database:
  certificates:
  caddy_config:

